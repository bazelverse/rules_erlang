shell_commands: &shell_commands
- curl -O https://raw.githubusercontent.com/kerl/kerl/master/kerl
- chmod a+x kerl
- ./kerl update releases
- ./kerl build ${ERLANG_VERSION}
- ./kerl install ${ERLANG_VERSION} ~/kerl/${ERLANG_VERSION}
- realpath ~/kerl/${ERLANG_VERSION}

matrix:
  bazel:
  - 8.x
  - 9.x
platforms:
  macos:
    environment:
      ERLANG_VERSION: "29.0.5"
      ERLANG_HOME: /Users/buildkite/kerl/29.0.5
    bazel: ${{ bazel }}
    shell_commands: *shell_commands
    build_flags:
    - --incompatible_strict_action_env
    build_targets:
    - '@rules_erlang//...'
  ubuntu2004:
    environment:
      ERLANG_VERSION: "29.0.5"
      ERLANG_HOME: /var/lib/buildkite-agent/kerl/29.0.5
    bazel: ${{ bazel }}
    shell_commands: *shell_commands
    build_flags:
    - --incompatible_strict_action_env
    build_targets:
    - '@rules_erlang//...'
